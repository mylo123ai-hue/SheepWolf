name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm test
      - name: Smoke test the Windows launcher and local data recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $env:SHEEPWOLF_LAUNCHER_TEST = '1'
          $env:SHEEPWOLF_DATA_DIR = Join-Path $env:RUNNER_TEMP 'SheepWolf Local Data'
          New-Item -ItemType Directory -Force -Path $env:SHEEPWOLF_DATA_DIR | Out-Null
          function Start-AppLauncher {
            Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c','"Start SheepWolf.bat"') -WorkingDirectory $root -PassThru
          }
          function Wait-AppReady($Process) {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:3000/api/health' -TimeoutSec 2
                $web = Invoke-WebRequest 'http://127.0.0.1:5173/' -TimeoutSec 2
                if ($health.app -eq 'SheepWolf' -and $web.Content.Contains('id="root"')) { return }
              } catch { }
              if ($Process.HasExited) { throw "Windows launcher exited with code $($Process.ExitCode)." }
              Start-Sleep -Milliseconds 500
            }
            throw 'Windows launcher did not make both loopback services ready within 45 seconds.'
          }
          function Stop-AppTree($Process) {
            if (-not $Process.HasExited) { & taskkill.exe /PID $Process.Id /T /F | Out-Null; $Process.WaitForExit(10000) | Out-Null }
          }
          $launcher = Start-AppLauncher
          try {
            Wait-AppReady $launcher
            $run = Invoke-RestMethod -Method Post 'http://127.0.0.1:3000/api/experiments' -ContentType 'application/json' -Body '{"scenarioId":"capture-the-flags","seed":"windows-launcher-data-smoke","mode":"demo","paceMs":30000,"maxDurationMs":60000,"maxDecisions":10}'
            $stopped = Invoke-RestMethod -Method Post "http://127.0.0.1:3000/api/experiments/$($run.id)/stop"
            if ($stopped.status -ne 'stopped') { throw 'The launcher smoke experiment did not stop cleanly.' }
            if (-not (Test-Path (Join-Path $env:SHEEPWOLF_DATA_DIR 'sheepwolf.sqlite'))) { throw 'The launcher did not create its configured SQLite database.' }
            $ports = Get-NetTCPConnection -State Listen -LocalPort 3000,5173
            if (($ports | Where-Object { $_.LocalAddress -ne '127.0.0.1' }).Count -gt 0) { throw 'A launcher service was not restricted to loopback.' }
            $listenerIds = @($ports | Select-Object -ExpandProperty OwningProcess -Unique | Sort-Object)
            $secondLaunch = Start-AppLauncher
            $secondLaunch.WaitForExit(10000) | Out-Null
            if (-not $secondLaunch.HasExited -or $secondLaunch.ExitCode -ne 0) { throw 'A repeat launcher invocation did not reuse the ready local app.' }
            $portsAfter = Get-NetTCPConnection -State Listen -LocalPort 3000,5173
            $listenerIdsAfter = @($portsAfter | Select-Object -ExpandProperty OwningProcess -Unique | Sort-Object)
            if (($listenerIds -join ',') -ne ($listenerIdsAfter -join ',')) { throw 'A repeat launcher invocation created extra local listeners.' }
          } finally { Stop-AppTree $launcher }
          $restarted = Start-AppLauncher
          try {
            Wait-AppReady $restarted
            $history = Invoke-RestMethod 'http://127.0.0.1:3000/api/history'
            if (-not ($history | Where-Object { $_.snapshot.id -eq $run.id -and $_.snapshot.status -eq 'stopped' })) { throw 'The configured SQLite history did not survive launcher restart.' }
            Write-Host "Windows launcher verified: Node $((node --version)), loopback 3000/5173, spaced data path, no duplicate listeners, stopped run persisted after process restart."
          } finally { Stop-AppTree $restarted }
      - name: Upload Windows Block 6 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-b06-windows-browser-evidence
          path: artifacts/b06-windows-credential/
          if-no-files-found: warn
